<!doctype html>
<html lang="fr" data-theme="graphite">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Asobi</title>
  <meta name="description" content="Asobi : ta collection de jeux vidéo, rangée par console, en cartes à collectionner. Connexion avec Discord, import Steam, PlayStation, Xbox, Epic et Nintendo.">
  <meta name="theme-color" content="#0f1014">
  <link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/img/logo.svg">
  <!-- Thème choisi (Profil › Apparence), appliqué avant le premier affichage -->
  <script src="/assets/js/theme-boot.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&family=Zen+Kaku+Gothic+New:wght@900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/app.css">
  <link rel="stylesheet" href="/assets/css/pages.css">
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <div class="shell">
    <aside class="sidebar" aria-label="Navigation">
      <a class="logo" href="#/" aria-label="Asobi, accueil"><span class="logo__mark" aria-hidden="true">遊</span><span class="logo__word">ASOBI</span></a>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar__foot">
        <button class="btn btn--primary" type="button" data-action="add" data-edit>+ Ajouter un jeu</button>
        <a class="me" href="#/profil" id="me"></a>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <nav class="crumbs" id="crumbs" aria-label="Fil d'Ariane"></nav>
        <div class="search">
          <span class="search__icon" aria-hidden="true">⌕</span>
          <input class="input" id="search" type="search" placeholder="Rechercher dans ta collection…" autocomplete="off" aria-label="Rechercher"
            role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-suggest">
          <kbd class="kbd">/</kbd>
          <ul class="suggest" id="search-suggest" role="listbox" aria-label="Propositions" hidden></ul>
        </div>
      </header>
      <div id="notices"></div>
      <main class="view" id="view"></main>
    </div>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Navigation"></nav>
  <div id="modals"></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script src="/assets/js/main.js" type="module"></script>
</body>
</html>
