<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Asobi</title>
  <meta name="description" content="Asobi : ma collection de jeux vidéo, rangée par console, en cartes à collectionner.">
  <meta name="theme-color" content="#06070b">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="blob"></div><div class="blob"></div><div class="blob"></div>
    <div class="ambient"></div><div class="ambient"></div>
  </div>

  <aside class="sidebar" aria-label="Navigation">
    <a class="logo" href="#/" aria-label="Asobi, accueil">
      <img class="logo-mark" src="assets/img/logo.svg" alt="" width="36" height="36">
      <span>Asobi</span>
    </a>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <button class="btn btn-primary btn-block" type="button" data-action="add">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>Ajouter un jeu
      </button>
      <a class="nav-link" href="#/profil" id="account-link"></a>
    </div>
  </aside>

  <div class="app">
    <header class="topbar">
      <div class="crumbs" id="crumbs"></div>
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 0 1 5.2 10.4l4.4 4.4-1.4 1.4-4.4-4.4A6.5 6.5 0 1 1 10.5 4zm0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z"/></svg>
        <input class="input" id="search" type="search" placeholder="Rechercher dans ta collection…" autocomplete="off" aria-label="Rechercher"
          role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-suggest">
        <kbd>/</kbd>
        <ul class="suggest" id="search-suggest" role="listbox" aria-label="Propositions" hidden></ul>
      </div>
    </header>
    <main class="view" id="view" aria-live="polite"></main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Navigation"></nav>
  <div id="modals"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="assets/js/main.js" type="module"></script>
</body>
</html>
