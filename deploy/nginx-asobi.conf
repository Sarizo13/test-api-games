# nginx pour asobi.sarizo.fr → conteneur Asobi (127.0.0.1:8095).
# Installation (root) :
#   cp deploy/nginx-asobi.conf /etc/nginx/sites-available/asobi
#   ln -s /etc/nginx/sites-available/asobi /etc/nginx/sites-enabled/asobi
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d asobi.sarizo.fr        (ajoute HTTPS et la redirection depuis HTTP)
server {
    server_name asobi.sarizo.fr;
    listen 80;
    listen [::]:80;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/asobi.access.log;
    error_log  /var/log/nginx/asobi.error.log;
}
