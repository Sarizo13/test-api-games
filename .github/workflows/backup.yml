name: Sauvegarder la collection

# Chaque nuit, une copie de la collection (Cloudflare KV) est enregistrée dans data/backup.json :
# l'historique Git garde ainsi toutes les versions passées.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger la collection
        run: |
          curl -fsS --retry 3 https://ludotheque.theopacheco5.workers.dev/collection -o /tmp/collection.json
          # Refuse une réponse qui ne ressemble pas à une collection (on garderait sinon une sauvegarde vide)
          jq -e '.games | type == "array"' /tmp/collection.json > /dev/null
          jq --sort-keys . /tmp/collection.json > data/backup.json

      - name: Enregistrer si quelque chose a changé
        run: |
          if git diff --quiet --exit-code -- data/backup.json && git ls-files --error-unmatch data/backup.json > /dev/null 2>&1; then
            echo "Rien de nouveau."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/backup.json
          git commit -m "Sauvegarde de la collection ($(jq '.games | length' data/backup.json) jeux)"
          git push
