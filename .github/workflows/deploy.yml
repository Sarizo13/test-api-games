name: Déployer le site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Appelé par « Ajouter un jeu » : un push fait avec le jeton des Actions ne relance pas les workflows
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Branche à jour, avec le jeu qui vient d'être ajouté
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
