name: Déployer le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # GitHub Pages laisse les navigateurs garder les fichiers 10 min en cache : chaque déploiement
      # donne une adresse unique au CSS et à chaque module JS pour qu'ils soient rechargés tout de suite.
      # Tous les imports reçoivent la même version : un module n'est donc jamais chargé deux fois.
      - name: Forcer le rechargement des fichiers
        run: |
          V=$(git rev-parse --short HEAD)
          sed -i "s#assets/css/app.css\"#assets/css/app.css?v=$V\"#; s#assets/js/main.js\"#assets/js/main.js?v=$V\"#" index.html
          find assets/js -name '*.js' -exec sed -i -E "s#(from '\.\.?/[^'?]+\.js)'#\1?v=$V'#g" {} +
          grep -c "?v=$V" index.html
          ! grep -rnE "from '\.\.?/[^'?]+\.js'" assets/js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
