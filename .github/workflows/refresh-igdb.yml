name: Mettre à jour depuis IGDB

# Ajoute les bandes-annonces (et l'ID, le lien et la note IGDB s'ils manquent) aux jeux déjà présents
on:
  workflow_dispatch:

concurrency:
  group: add-game # même groupe que l'ajout : jamais deux écritures de games.json en même temps
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.refresh.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Interroger IGDB
        id: refresh
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: node scripts/refresh-igdb.mjs

      - name: Enregistrer dans le dépôt
        if: steps.refresh.outputs.changed != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games.json
          git commit -m "Mise à jour depuis IGDB (bandes-annonces)"
          git pull --rebase
          git push

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed != '0'
    uses: ./.github/workflows/deploy.yml
